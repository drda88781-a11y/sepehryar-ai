services:
  - type: web
    name: sepehryar-ai
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements-cloud.txt"
    startCommand: "python start_production.py"
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: MODEL_PROVIDER
        value: gemini
      - key: OFFLINE_STRICT
        value: "false"
